      engine: MLX-Serve 26.9.6
      model_revision: 9c9273578ed5c2daf0b9a42eace823a6a49050ba
      report: validation/preview.11.json
      scope: 256x256, 22 frames, four turbo steps, RGB8 video and PCM16 stereo through
        the updated gateway
  embeddings:
    implementation: native task, space qualification, OpenAI codec and passthrough
    status: tested-with-real-backend
    path: /v1/embeddings
    wire: openai.embeddings.v1
  ark_embeddings:
    implementation: native Ark egress request codec and embedding response container
      conversion
    status: tested-with-real-backend
    path: /api/v3/embeddings/multimodal
    wire: ark.embeddings.v1
    client_path: /v1/embeddings
    limits: one joint text/image sample; float/base64; discrete model dimensions
tests:
  unit: native AMD64 and ARM64/QEMU protocol, catalog, config, selection, DSL and
    targeted extproc tests passed
  kubernetes: 39 embedding and Ark gateway cases passed on native AMD64 and native
    ARM64
  real: Native ARM64 real Qwen3-VL-Embedding-2B and Ark multimodal embedding, existing
    text/cloud and H3 regression passed; see per-suite evidence.
  historical_baseline: preview.10 full-media mock and prior TTS/WebSocket suites were
    not repeated for preview.11
known_limits:
  native_media_cross_wire: Ark embedding response-container translation only; other
    media retains its exact wire
  mlx_video: MLX-Serve 26.9.6 native synchronous JSON or progress SSE; caller muxes
    RGB8/PCM16; no async video job API; no Ref2VA/host-local LoRA fields
  h3_deployment: macOS native Metal host, outside the Linux K8s VM
  prior_features: The pre-embedding full-media mock matrix is preserved as historical
    preview.10 evidence.
