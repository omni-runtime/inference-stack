models:
- name: local/text
  pool: vllm
  service: vllm
  provider_model_id: local/text
  api_format: openai
  provider: vllm
  api_key_env: MODEL_API_KEY
  base_url: http://vllm:8000/v1
  capabilities:
  - text
  - tools
  - structured_json
  context_window: 2048
  max_output_tokens: 512
  model_directory: Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  deployment:
    image: vllm
    replicas: 1
    command:
    - vllm
    - serve
    - /models/Qwen3-0.6B
    - --served-model-name
    - local/text
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --max-model-len
    - '2048'
    - --gpu-memory-utilization
    - '0.65'
    - --enforce-eager
- name: local/speech
  pool: omni
  service: omni
  provider_model_id: local/speech
  api_format: speech
  provider: vllm-omni
  api_key_env: MODEL_API_KEY
  base_url: http://omni:8000/v1
  capabilities:
  - text
  - speech_generation
  context_window: 8192
  max_output_tokens: 2048
  model_directory: Qwen3-TTS-12Hz-0.6B-CustomVoice
  revision: 85e237c12c027371202489a0ec509ded67b5e4b5
  deployment:
    image: omni
    replicas: 1
    command:
