models:
- name: local/text
  pool: vllm
  service: vllm
  provider_model_id: local/text
  api_format: openai
  provider: vllm
  api_key_env: MODEL_API_KEY
  base_url: http://vllm:8000/v1
  capabilities:
  - text
  context_window: 2048
  max_output_tokens: 512
  model_directory: Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  deployment:
    image: vllm
    replicas: 1
    command:
    - vllm
    - serve
    - /models/Qwen3-0.6B
    - --served-model-name
    - local/text
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --max-model-len
    - '2048'
    - --gpu-memory-utilization
    - '0.65'
    - --enforce-eager
    - --dtype
    - half
    - --max-num-seqs
    - '1'
    - --max-num-batched-tokens
    - '512'
    - --default-chat-template-kwargs
    - '{"enable_thinking":false}'
    node_port: 30810
- name: cloud/chat
  pool: cloud
  service: cloud
  provider_model_id: your-cloud-model
  api_format: openai
  provider: openai
  api_key_env: CLOUD_API_KEY
  base_url: https://api.example.com/v1
  capabilities:
  - text
  - image_input
  context_window: 32768
  max_output_tokens: 2048
