schema_version: 1
name: sample-cluster
mode: real
hosts:
  gateway:
    ssh: operator@gateway.example.test
    root: /opt/omni-runtime/inference-stack
  mlx:
    ssh: operator@mlx.example.test
    root: /opt/omni-runtime/inference-stack
    platform: darwin/arm64
  text:
    ssh: operator@gpu.example.test
    root: /srv/inference-stack
    platform: linux/amd64
gateway:
  runtime: kubernetes
  platform: linux/arm64
  project: inference-stack
  host: gateway
  kubernetes:
    context: demo-cluster
    kubeconfig: kubeconfig
    namespace: inference-stack
    node: control-plane
    gateway_node_port: 30800
  url: http://gateway.example.test:30800
resources:
  router_memory: 1Gi
  router_cpus: 2
  envoy_memory: 512Mi
  envoy_cpus: 2
  mock_memory: 256Mi
  mock_cpus: 1
  gpu_count: 0
  local_engines_concurrent: false
  reason: ARM64 gateway on the control plane and one AMD64 NVIDIA worker in the same
    cluster.
  model_memory: 8Gi
  model_cpus: 4
artifacts:
  release: ../../contracts/release.yaml
  versions: ../../versions.lock.yml
secrets:
  file: secrets.env
backends:
  vllm:
    pool: vllm
    provider: vllm
    base_url: http://vllm.inference-stack.svc.cluster.local:8000/v1
    api_key_env: MODEL_API_KEY
    deployment:
      mode: managed
      node: text
      image: vllm
      replicas: 1
      command:
      - vllm
      - serve
      - /models/Qwen3-0.6B
      - --served-model-name
      - local/text
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --max-model-len
      - '2048'
    host: text
  mlx-h3:
    pool: omni
    provider: mlx-serve
    base_url: http://192.0.2.20:11234/v1
    api_key_env: MODEL_API_KEY
    deployment:
      mode: external
    host: mlx
    mlx:
      home: /opt/omni-runtime/host-mlx
      listen: 127.0.0.1
      port: 11234
      max_concurrent: 1
      timeout: 3600
      model_directory: MiniMax-H3-FL2VA-4bit
      model_manifest: ../../tools/host-mlx/model-manifest.json
      engine_lock: ../../tools/host-mlx/versions.json
  cloud:
    pool: cloud
    provider: openai
    base_url: https://api.example.com/v1
    api_key_env: CLOUD_API_KEY
    deployment:
      mode: external
models:
- name: local/text
  provider_model_id: local/text
  api_format: openai
  capabilities:
  - text
  context_window: 2048
  max_output_tokens: 512
  model_directory: Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  backend: vllm
- name: local/video
  provider_model_id: MiniMax-H3-FL2VA-4bit
  api_format: mlx_video
  capabilities:
  - text
  - image_input
  - video_generation
  - video_output
  - audio_output
  context_window: 4096
  max_output_tokens: 1
  request_timeout_seconds: 3600
  backend: mlx-h3
- name: cloud/chat
  provider_model_id: your-cloud-model
  api_format: openai
  capabilities:
  - text
  - image_input
  context_window: 32768
  max_output_tokens: 2048
  backend: cloud
routing:
  enabled_models:
  - local/text
  - local/video
  - cloud/chat
cluster:
  distribution: k3s
  version: v1.36.4+k3s1
  server: https://192.0.2.10:6443
  control_plane:
    host: gateway
    node: control-plane
    address: 192.0.2.10
    platform: linux/arm64
    flannel_interface: eth0
  workers:
    text:
      host: text
      node: gpu-worker
      address: 192.0.2.30
      platform: linux/amd64
      flannel_interface: zt0
      runtime_class: nvidia
      model_root: /srv/models
      gpu_count: 1
      data_dir: /var/lib/rancher/k3s-inference-stack
