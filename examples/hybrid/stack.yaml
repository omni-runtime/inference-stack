schema_version: 1
name: hybrid
mode: real
hosts:
  gateway:
    ssh: operator@gateway.example.test
    root: /opt/omni-runtime/inference-stack
  mlx:
    ssh: operator@mlx.example.test
    root: /opt/omni-runtime/inference-stack
    platform: darwin/arm64
  text:
    ssh: operator@gpu.example.test
    root: /srv/inference-stack
    platform: linux/amd64
gateway:
  runtime: kubernetes
  platform: linux/arm64
  project: inference-stack
  host: gateway
  kubernetes:
    context: colima-inference-stack
    kubeconfig: kubeconfig
    namespace: inference-stack
    node: colima-inference-stack
    gateway_node_port: 30800
  url: http://gateway.example.test:30800
resources:
  router_memory: 1Gi
  router_cpus: 2
  envoy_memory: 512Mi
  envoy_cpus: 2
  mock_memory: 256Mi
  mock_cpus: 1
  gpu_count: 0
  local_engines_concurrent: false
  reason: Gateway-only ARM64 VM; external text on NVIDIA host and H3 on macOS Metal.
artifacts:
  release: ../../contracts/release.yaml
  versions: ../../versions.lock.yml
secrets:
  file: secrets.env
backends:
  vllm:
    pool: vllm
    provider: vllm
    base_url: http://192.0.2.30:30810/v1
    api_key_env: MODEL_API_KEY
    deployment:
      mode: external
    host: text
  mlx-h3:
    pool: omni
    provider: mlx-serve
    base_url: http://192.0.2.20:11234/v1
    api_key_env: MODEL_API_KEY
    deployment:
      mode: external
    host: mlx
    mlx:
      home: /opt/omni-runtime/host-mlx
      listen: 127.0.0.1
      port: 11234
      max_concurrent: 1
      timeout: 3600
      model_directory: MiniMax-H3-FL2VA-4bit
      model_manifest: ../../tools/host-mlx/model-manifest.json
      engine_lock: ../../tools/host-mlx/versions.json
  cloud:
    pool: cloud
    provider: openai
    base_url: https://api.example.com/v1
    api_key_env: CLOUD_API_KEY
    deployment:
      mode: external
models:
- name: local/text
  provider_model_id: local/text
  api_format: openai
  capabilities:
  - text
  context_window: 2048
  max_output_tokens: 512
  model_directory: Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  backend: vllm
- name: local/video
  provider_model_id: MiniMax-H3-FL2VA-4bit
  api_format: mlx_video
  capabilities:
  - text
  - image_input
  - video_generation
  - video_output
  - audio_output
  context_window: 4096
  max_output_tokens: 1
  request_timeout_seconds: 3600
  backend: mlx-h3
- name: cloud/chat
  provider_model_id: your-cloud-model
  api_format: openai
  capabilities:
  - text
  - image_input
  context_window: 32768
  max_output_tokens: 2048
  backend: cloud
routing:
  enabled_models:
  - local/text
  - local/video
  - cloud/chat
