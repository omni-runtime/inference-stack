schema_version: 1
name: sample-vllm-cloud
mode: mock
hosts:
  gateway:
    ssh: operator@gateway.example.test
    root: /srv/inference-stack
gateway:
  runtime: kubernetes
  platform: linux/amd64
  project: inference-stack
  host: gateway
  kubernetes:
    context: default
    kubeconfig: /srv/inference-stack/environments/kubernetes/kubeconfig
    namespace: inference-stack
    node: gpu-node
    gateway_node_port: 30800
    runtime_class: nvidia
    model_root: /srv/models
resources:
  router_memory: 1Gi
  router_cpus: 2
  envoy_memory: 512Mi
  envoy_cpus: 2
  mock_memory: 256Mi
  mock_cpus: 1
  model_memory: 8Gi
  model_cpus: 4
  gpu_count: 1
  local_engines_concurrent: false
  reason: Single 6 GiB GPU; simultaneous real-engine capacity unverified. Never stop
    another model automatically.
artifacts:
  release: ../../contracts/release.yaml
  versions: ../../versions.lock.yml
secrets:
  file: secrets.env
backends:
  vllm:
    pool: vllm
    provider: vllm
    base_url: http://vllm:8000/v1
    api_key_env: MODEL_API_KEY
    deployment:
      image: vllm
      replicas: 1
      command:
      - vllm
      - serve
      - /models/Qwen3-0.6B
      - --served-model-name
      - local/text
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --max-model-len
      - '2048'
      - --gpu-memory-utilization
      - '0.65'
      - --enforce-eager
      - --dtype
      - half
      - --max-num-seqs
      - '1'
      - --max-num-batched-tokens
      - '512'
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      mode: managed
  cloud:
    pool: cloud
    provider: openai
    base_url: https://api.example.com/v1
    api_key_env: CLOUD_API_KEY
    deployment:
      mode: external
models:
- name: local/text
  provider_model_id: local/text
  api_format: openai
  capabilities:
  - text
  context_window: 2048
  max_output_tokens: 512
  model_directory: Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  backend: vllm
- name: cloud/chat
  provider_model_id: your-cloud-model
  api_format: openai
  capabilities:
  - text
  - image_input
  context_window: 32768
  max_output_tokens: 2048
  backend: cloud
routing:
  enabled_models:
  - local/text
  - cloud/chat
