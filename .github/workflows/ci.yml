name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python scripts/validate-public.py
      - run: python -m unittest discover -s tests/unit -v
      - name: Render every Kubernetes pool combination without a cluster
        run: |
          for example in examples/*/example.yaml; do
            scenario=$(basename "$(dirname "$example")")
            python scripts/deploy.py render --runtime kubernetes --environment kubernetes --example "$scenario" --overlay mock --config-only
          done
          python scripts/deploy.py render --runtime kubernetes --environment hybrid --example vllm-omni-cloud --catalog environments/hybrid/catalog.yaml --overlay mock --config-only
